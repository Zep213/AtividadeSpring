<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h1, h2 {
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        form {
            margin-bottom: 20px;
        }
        form input[type="text"],
        form input[type="number"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        form button {
            width: 100%;
            padding: 10px;
            border: none;
            background: #28a745;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        form button.cancelar {
            background-color: #6c757d;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .actions button {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            margin-right: 5px;
        }
        .edit-btn {
            background-color: #ffc107;
        }
        .delete-btn {
            background-color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerenciamento de Alunos</h1>

    <h2>Adicionar / Editar Aluno</h2>
    <form id="alunoForm">
        <input type="hidden" id="alunoId">
        <input type="text" id="nome" placeholder="Nome do Aluno" required>
        <input type="number" id="idade" placeholder="Idade do Aluno" required>
        <input type="text" id="email" placeholder="Email do Aluno" required>
        <input type="text" id="curso" placeholder="Curso do Aluno" required>
        <button type="submit" id="btnSalvar">Salvar</button>
        <button type="button" class="cancelar" id="btnCancelar" style="display:none;" onclick="limparFormulario()">Cancelar Edição</button>
    </form>

    <h2>Lista de Alunos</h2>
    <table id="alunosTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Email</th>
            <th>Curso</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<script>
    const apiUrl = 'http://localhost:8082/aluno'; // URL do backend.
    const form = document.getElementById('alunoForm');
    const alunoIdInput = document.getElementById('alunoId');
    const nomeInput = document.getElementById('nome');
    const idadeInput = document.getElementById('idade');
    const emailInput = document.getElementById('email');
    const cursoInput = document.getElementById('curso');
    const btnSalvar = document.getElementById('btnSalvar');
    const btnCancelar = document.getElementById('btnCancelar');
    const tableBody = document.querySelector("#alunosTable tbody");

    async function listarAlunos() {
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error('Erro ao buscar alunos');
            }
            const alunos = await response.json();
            tableBody.innerHTML = '';
            alunos.forEach(aluno => {
                const row = `<tr>
                    <td>${aluno.id}</td>
                    <td>${aluno.nome}</td>
                    <td>${aluno.idade}</td>
                    <td>${aluno.email}</td>
                    <td>${aluno.curso}</td>
                    <td class="actions">
                        <button class="edit-btn" onclick="editarAluno(${aluno.id}, '${aluno.nome}', ${aluno.idade},{aluno.email},{aluno.curso})">Editar</button>
                        <button class="delete-btn" onclick="excluirAluno(${aluno.id})">Excluir</button>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        } catch (error) {
            console.error('Falha na requisição:', error);
            alert('Não foi possível carregar a lista de alunos.');
        }
    }

    async function salvarAluno(event) {
        event.preventDefault();
        const id = alunoIdInput.value;
        const nome = nomeInput.value;
        const idade = idadeInput.value;
        const email = emailInput.value;
        const curso = cursoInput.value;
        const aluno = { nome, idade, email, curso: parseInt(idade) };
        const isEditing = id !== '';
        const url = isEditing ? `${apiUrl}/${id}` : apiUrl;
        const method = isEditing ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(aluno)
            });
            if (!response.ok) {
                throw new Error('Erro ao salvar aluno');
            }
            limparFormulario();
            listarAlunos();
            alert(`Aluno ${isEditing ? 'atualizado' : 'salvo'} com sucesso!`);
        } catch (error) {
            console.error('Falha ao salvar:', error);
            alert('Ocorreu um erro ao salvar o aluno.');
        }
    }

    function editarAluno(id, nome, idade, email, curso) {
        alunoIdInput.value = id;
        nomeInput.value = nome;
        idadeInput.value = idade;
        emailInput.value = email;
        cursoInput.value = curso;
        btnSalvar.textContent = 'Atualizar';
        btnCancelar.style.display = 'block';
        window.scrollTo(0, 0);
    }

    async function excluirAluno(id) {
        if (confirm('Tem certeza que deseja excluir este aluno?')) {
            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) {
                    throw new Error('Erro ao excluir aluno');
                }
                listarAlunos();
                alert('Aluno excluído com sucesso!');
            } catch (error) {
                console.error('Falha ao excluir:', error);
                alert('Ocorreu um erro ao excluir o aluno.');
            }
        }
    }

    function limparFormulario() {
        form.reset();
        alunoIdInput.value = '';
        btnSalvar.textContent = 'Salvar';
        btnCancelar.style.display = 'none';
    }

    form.addEventListener('submit', salvarAluno);
    document.addEventListener('DOMContentLoaded', listarAlunos);
</script>
</body>
</html>
