<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover-color: #0056b3;
            --danger-color: #dc3545;
            --danger-hover-color: #c82333;
            --light-gray-color: #f8f9fa;
            --gray-color: #dee2e6;
            --dark-gray-color: #343a40;
            --background-color: #eef1f5;
            --card-background-color: #ffffff;
            --shadow: 0 4px 8px rgba(0,0,0,0.1);
            --border-radius: 8px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 2em;
            color: var(--dark-gray-color);
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h2, h3 {
            color: var(--dark-gray-color);
            text-align: center;
            margin-bottom: 1em;
        }

        .card {
            background-color: var(--card-background-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2em;
            margin-bottom: 2em;
        }

        #alunoForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 1.5em;
        }

        #alunoForm input {
            grid-column: span 1;
        }

        #alunoForm .full-width {
            grid-column: span 2;
        }

        .form-actions {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .search-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            align-items: center;
            margin-bottom: 1.5em;
        }

        .search-container {
             display: flex;
             gap: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-color);
            border-radius: var(--border-radius);
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: var(--border-radius);
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button[type="submit"] {
            background-color: var(--primary-color);
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover-color);
        }

        button.clear-btn {
            background-color: var(--gray-color);
            color: var(--dark-gray-color);
        }

        button.clear-btn:hover {
            background-color: #c8cbcf;
        }

        button.search-btn {
             background-color: var(--primary-color);
             white-space: nowrap;
        }

         button.search-btn:hover {
             background-color: var(--primary-hover-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--gray-color);
        }

        thead {
            background-color: var(--primary-color);
            color: white;
        }

        thead th:first-child {
            border-top-left-radius: var(--border-radius);
        }

        thead th:last-child {
            border-top-right-radius: var(--border-radius);
        }

        tbody tr:nth-child(even) {
            background-color: var(--light-gray-color);
        }

        tbody tr:hover {
            background-color: #e2e6ea;
        }

        .action-buttons button {
            padding: 8px 12px;
            margin-right: 5px;
        }

        .btn-edit {
             background-color: var(--primary-color);
        }
        .btn-edit:hover {
             background-color: var(--primary-hover-color);
        }

        .btn-delete {
            background-color: var(--danger-color);
        }
        .btn-delete:hover {
            background-color: var(--danger-hover-color);
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Gerenciamento de Alunos</h2>

    <div class="card">
        <form id="alunoForm">
            <input type="hidden" id="alunoId" name="id">
            <input type="text" id="nome" name="nome" placeholder="Nome Completo" required class="full-width">
            <input type="number" id="idade" name="idade" placeholder="Idade" required>
            <input type="number" id="matricula" name="matricula" placeholder="Matrícula" required>
            <input type="text" id="curso" name="curso" placeholder="Curso" required>
            <input type="email" id="email" name="email" placeholder="E-mail" required>
            <input type="text" id="telefone" name="telefone" placeholder="Telefone" required class="full-width">
            <div class="form-actions">
                <button type="button" class="clear-btn" onclick="clearForm()">Limpar</button>
                <button type="submit">Salvar Aluno</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h3>Lista de Alunos</h3>
        <div class="search-area">
            <div class="search-container">
                <input type="text" id="searchNameInput" placeholder="Buscar por nome...">
                <button class="search-btn" onclick="searchAlunosByName()">Buscar</button>
            </div>
            <div class="search-container">
                <input type="number" id="searchIdInput" placeholder="Buscar por ID...">
                <button class="search-btn" onclick="searchAlunoById()">Buscar</button>
            </div>
        </div>
        <button class="clear-btn" onclick="fetchAlunos()">Mostrar Todos</button>
        <table id="alunosTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Matrícula</th>
                <th>Curso</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<script>
    const apiUrl = 'http://localhost:8082/aluno';

function renderTable(alunos) {
    const tableBody = document.getElementById('alunosTable').getElementsByTagName('tbody')[0];
    tableBody.innerHTML = '';

    // Se a lista de alunos estiver vazia, não faz nada
    if (!alunos || alunos.length === 0) {
        return;
    }

    alunos.forEach(aluno => {
        let row = tableBody.insertRow();

        row.innerHTML = `
            <td>${aluno.id}</td>
            <td>${aluno.nome}</td>
            <td>${aluno.idade}</td>
            <td>${aluno.matricula}</td>
            <td>${nomeCurso}</td>
            <td>${aluno.email}</td>
            <td>${aluno.telefone}</td>
            <td class="action-buttons">
                <button class="btn-edit" onclick="editAluno(${aluno.id})">Editar</button>
                <button class="btn-delete" onclick="deleteAluno(${aluno.id})">Excluir</button>
            </td>
        `;
    });
}

    document.getElementById('alunoForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const id = document.getElementById('alunoId').value;
        const aluno = {
            nome: document.getElementById('nome').value,
            idade: parseInt(document.getElementById('idade').value),
            matricula: parseInt(document.getElementById('matricula').value),
            curso: {
                nome: document.getElementById('curso').value
            },
            email: document.getElementById('email').value,
            telefone: document.getElementById('telefone').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${apiUrl}/${id}` : apiUrl;

        fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(aluno),
        })
        .then(response => {
            if (!response.ok) {
                 throw new Error('A resposta da rede não foi ok');
            }
            return response.json();
        })
        .then(() => {
            fetchAlunos();
            clearForm();
        })
        .catch(error => console.error('Erro ao salvar aluno:', error));
    });

    function editAluno(id) {
        fetch(`${apiUrl}/${id}`)
            .then(response => response.json())
            .then(aluno => {
                document.getElementById('alunoId').value = aluno.id;
                document.getElementById('nome').value = aluno.nome;
                document.getElementById('idade').value = aluno.idade;
                document.getElementById('matricula').value = aluno.matricula;
                document.getElementById('curso').value = aluno.curso.nome;
                document.getElementById('email').value = aluno.email;
                document.getElementById('telefone').value = aluno.telefone;
                window.scrollTo(0, 0);
            });
    }

    function fetchAlunos() {
        document.getElementById('searchNameInput').value = '';
        document.getElementById('searchIdInput').value = '';

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => renderTable(data));
    }

    function deleteAluno(id) {
        if (confirm('Tem certeza que deseja excluir este aluno?')) {
            fetch(`${apiUrl}/${id}`, {
                method: 'DELETE',
            })
            .then(() => {
                fetchAlunos();
            });
        }
    }

    function searchAlunosByName() {
        const nome = document.getElementById('searchNameInput').value;
        const url = nome ? `${apiUrl}/busca?nome=${encodeURIComponent(nome)}` : apiUrl;
        fetch(url)
            .then(response => response.json())
            .then(data => renderTable(data));
    }

    function searchAlunoById() {
        const id = document.getElementById('searchIdInput').value;
        if (!id) {
            alert('Por favor, insira um ID para buscar.');
            return;
        }

        fetch(`${apiUrl}/${id}`)
            .then(response => {
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    return response.json();
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .then(aluno => {
                renderTable([aluno]);
            })
            .catch(error => {
                alert(error.message);
                fetchAlunos();
            });
    }

    function clearForm() {
        document.getElementById('alunoId').value = '';
        document.getElementById('alunoForm').reset();
    }

    document.addEventListener('DOMContentLoaded', fetchAlunos);

</script>

</body>
</html>
