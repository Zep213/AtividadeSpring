spring.application.name=AtividadeSpring
server.port=8082

#H2 Conection
#DB_CLOSE_DELAY=-1
#DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:mem:listaalunosdb;DB_CLOSE_DELAY=-1;DB_ON_EXITE=FALSE
spring.datasource.drive-class-name=org.h2.Driver
spring.datasource.usename=sa
spring.datasource.password=

#Console H2
spring.h2.console.enable=true
spring.h2.console.path=/h2-console